<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">

  <title>FORTY-FOUR — A BANNED PAGAN</title>

  <style>
    :root {
      --black: #080808;
      --dark: #111111;
      --grey: #777777;
      --light-grey: #b8b8b8;
      --white: #eeeeee;
      --line: #292929;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
       ========================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 24px 42px;
      background: rgba(8, 8, 8, 0.96);
      border-bottom: 1px solid var(--line);
    }

    /* Version initiale du logo temporaire */

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .logo-number {
      font-size: 25px;
      line-height: 1;
    }

    .logo-name {
      font-size: 13px;
      line-height: 1;
    }

    nav {
      display: flex;
      gap: 28px;

      font-size: 11px;
      letter-spacing: 0.18em;
    }

    nav a {
      color: var(--light-grey);
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--white);
    }

    /* =========================
       GENERAL
       ========================= */

    section {
      padding: 130px 8vw;
      border-bottom: 1px solid var(--line);
    }

    .section-number {
      font-size: 12px;
      color: var(--grey);
      letter-spacing: 0.18em;
      margin-bottom: 45px;
    }

    .section-title {
      font-size: clamp(40px, 7vw, 100px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }

    /* =========================
       HERO
       ========================= */

      min-height: 100vh;

      padding: 150px 8vw 80px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      position: relative;
      overflow: hidden;
    }
